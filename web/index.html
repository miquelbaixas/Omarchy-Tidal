<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tidal Connect</title>
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
  <div id="app" class="app">
    <aside id="sidebar" class="sidebar"></aside>
    <main class="main">
      <header id="topbar" class="topbar"></header>
      <div id="view" class="view" tabindex="-1"></div>
    </main>
    <aside id="queue-panel" class="queue-panel" hidden></aside>
    <footer id="playerbar" class="playerbar"></footer>
  </div>
  <div id="nowplaying" class="nowplaying" hidden></div>
  <div id="login" class="login" hidden></div>
  <div id="menu" class="menu" hidden></div>
  <div id="popover" class="popover" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
